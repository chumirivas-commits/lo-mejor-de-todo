<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#7a0019">
  <title>Lo Mejor de Todo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#0f0f12;
      --panel:#19191f;
      --panel2:#23232b;
      --text:#ffffff;
      --muted:#b8b8c2;
      --accent:#c5163a;
      --accent2:#7a0019;
      --line:#30303a;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(180deg,#160008 0,#0f0f12 260px);
      color:var(--text);
      min-height:100vh;
    }
    button,a{font:inherit}
    button{cursor:pointer}
    img,video{display:block;max-width:100%}
    .hidden{display:none!important}

    header{
      padding:24px 16px 18px;
      text-align:center;
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(15,15,18,.94);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
    }
    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
    }
    .brand-mark{
      width:54px;height:54px;border-radius:50%;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      font-size:28px;border:2px solid #ff6b86;
    }
    h1{margin:0;font-size:24px}
    .subtitle{margin:6px 0 0;color:var(--muted);font-size:14px}

    .toolbar{
      max-width:1080px;
      margin:18px auto 0;
      padding:0 16px;
    }
    .search{
      width:100%;
      padding:13px 15px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--panel);
      color:var(--text);
      font-size:16px;
    }

    .grid{
      max-width:1080px;
      margin:18px auto 40px;
      padding:0 16px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:18px;
    }
    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 24px rgba(0,0,0,.2);
    }
    .profile-link{
      width:100%;
      border:0;
      padding:0;
      background:transparent;
      color:inherit;
      text-align:left;
    }
    .cover{
      width:100%;
      aspect-ratio:4/5;
      object-fit:cover;
      background:var(--panel2);
    }
    .placeholder{
      width:100%;
      aspect-ratio:4/5;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#31232a,#17171c);
      color:#e7b5c0;
      font-size:54px;
    }
    .card-body{padding:14px}
    .name{font-size:20px;margin:0 0 6px}
    .short{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
    .card-actions{padding:0 14px 14px}
    .btn{
      width:100%;
      border:0;
      border-radius:12px;
      padding:12px 14px;
      font-weight:700;
      color:#fff;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
    }
    .btn.secondary{
      background:var(--panel2);
      border:1px solid var(--line);
    }

    .profile{
      position:fixed;
      inset:0;
      z-index:50;
      background:var(--bg);
      overflow:auto;
    }
    .profile-top{
      position:sticky;
      top:0;
      z-index:5;
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 16px;
      background:rgba(15,15,18,.96);
      border-bottom:1px solid var(--line);
    }
    .back{
      border:1px solid var(--line);
      background:var(--panel);
      color:#fff;
      border-radius:10px;
      padding:9px 12px;
    }
    .profile-wrap{
      max-width:960px;
      margin:0 auto;
      padding:18px 16px 48px;
    }
    .hero{
      display:grid;
      grid-template-columns:220px 1fr;
      gap:20px;
      align-items:start;
    }
    .hero img,.hero .placeholder{
      border-radius:18px;
      aspect-ratio:4/5;
      object-fit:cover;
    }
    .profile-name{font-size:30px;margin:4px 0 8px}
    .bio{color:var(--muted);line-height:1.6}
    .profile-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:18px;
    }
    .section-title{margin:28px 0 14px;font-size:21px}
    .gallery{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }
    .media{
      aspect-ratio:1/1;
      border-radius:12px;
      overflow:hidden;
      background:var(--panel2);
      border:1px solid var(--line);
    }
    .media img,.media video{
      width:100%;height:100%;object-fit:cover;
    }
    .empty-media{
      width:100%;height:100%;
      display:grid;place-items:center;
      color:#777;font-size:28px;
    }

    .viewer{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}
    .viewer-top{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:14px;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent)}
    .viewer-close{border:0;background:rgba(30,30,35,.9);color:#fff;border-radius:999px;padding:10px 14px}
    .viewer-title{font-weight:700}
    .slides{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain}
    .slide{min-height:100vh;position:relative;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;background:#000}
    .slide img,.slide video{width:100%;height:100vh;object-fit:contain;background:#000}
    .slide-overlay{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:end;padding:24px 18px 30px;background:linear-gradient(transparent,rgba(0,0,0,.8))}
    .slide-name{font-weight:700;font-size:20px}
    .like-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
    .like-btn{width:58px;height:58px;border-radius:50%;border:0;background:rgba(30,30,35,.9);color:#fff;font-size:30px;display:grid;place-items:center}
    .like-btn.liked{color:#ff2d55}
    .like-label{font-size:12px;color:#fff}

    footer{
      text-align:center;
      padding:24px 16px 40px;
      color:var(--muted);
      font-size:13px;
    }

    .age-gate{
      position:fixed;inset:0;z-index:100;
      display:grid;place-items:center;
      background:rgba(0,0,0,.94);
      padding:20px;
    }
    .age-card{
      width:min(430px,100%);
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:20px;
      padding:24px;
      text-align:center;
    }
    .age-card h2{margin-top:0}
    .age-actions{display:grid;gap:10px;margin-top:18px}

    @media(max-width:680px){
      .grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:0 10px}
      .hero{grid-template-columns:110px 1fr;gap:14px}
      .profile-name{font-size:24px}
      .profile-actions{grid-template-columns:1fr}
      .gallery{grid-template-columns:repeat(3,1fr)}
    }
  </style>
</head>
<body>
  <div id="ageGate" class="age-gate">
    <div class="age-card">
      <h2>Contenido para mayores de 18 años</h2>
      <p class="bio">Al continuar confirmas que eres mayor de edad y aceptas ver perfiles publicados con autorización.</p>
      <div class="age-actions">
        <button id="enterBtn" class="btn" type="button">Soy mayor de 18 años</button>
        <button id="leaveBtn" class="btn secondary" type="button">Salir</button>
      </div>
    </div>
  </div>

  <header>
    <div class="brand">
      <div class="brand-mark">💋</div>
      <div>
        <h1>Lo Mejor de Todo</h1>
        <p class="subtitle">Perfiles y contacto directo por Telegram</p>
      </div>
    </div>
  </header>

  <main id="homeView">
    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="Buscar una creadora..." autocomplete="off">
    </div>
    <section id="profilesGrid" class="grid"></section>
  </main>

  <section id="profileView" class="profile hidden" aria-live="polite">
    <div class="profile-top">
      <button id="backBtn" class="back" type="button">← Volver</button>
      <strong id="topName">Perfil</strong>
    </div>
    <div class="profile-wrap">
      <div class="hero">
        <div id="heroImage"></div>
        <div>
          <h2 id="profileName" class="profile-name"></h2>
          <p id="profileBio" class="bio"></p>
          <div class="profile-actions">
            <button id="buyBtn" class="btn" type="button">💬 Comprar por Telegram</button>
            <button id="chatBtn" class="btn secondary" type="button">📢 Ver canal</button>
          </div>
        </div>
      </div>

      <h3 class="section-title">Publicaciones</h3>
      <div id="gallery" class="gallery"></div>
    </div>
  </section>


  <section id="viewer" class="viewer hidden" aria-live="polite">
    <div class="viewer-top">
      <button id="viewerClose" class="viewer-close" type="button">✕ Cerrar</button>
      <div id="viewerTitle" class="viewer-title"></div>
      <div style="width:82px"></div>
    </div>
    <div id="slides" class="slides"></div>
  </section>

  <footer>Solo perfiles de personas adultas que hayan autorizado su publicación.</footer>

  <script>
    const telegram = window.Telegram?.WebApp;
    if (telegram) {
      telegram.ready();
      telegram.expand();
    }

    /*
      PARA EDITAR UNA CHICA:
      - name: nombre visible
      - username: usuario de Telegram SIN @
      - image: nombre exacto de la foto principal subida a GitHub
      - description: descripción corta de la tarjeta
      - bio: descripción completa dentro del perfil
      - posts: lista de fotos o videos. Puedes añadir hasta 30 o más.
        Foto:  { type: "image", src: "nombre.jpeg" }
        Video: { type: "video", src: "nombre.mp4" }
    */
    const creators = [
      {
        id: 1,
        name: "Valeria Castañeda",
        username: "valeriapremium",
        channel: "valeriapremium1",
        image: "photo_2026-08-01 16.47.50.jpeg",
        description: "Perfil exclusivo y atención directa por Telegram.",
        bio: "Aquí puedes escribir la descripción completa de Valeria.",
        posts: [
          { type: "image", src: "photo_2026-08-01 16.47.50.jpeg" },
          { type: "image", src: "valeria00001.jpg" },
          { type: "image", src: "valeria00002.jpg" },
          { type: "video", src: "valeria00022.mp4" },
          { type: "image", src: "valeria00003.jpg" },
          { type: "image", src: "valeria00004.jpg" },
          { type: "image", src: "valeria00005.jpg" },
          { type: "video", src: "valeria00023.mp4" },
          { type: "image", src: "valeria00006.jpg" },
          { type: "image", src: "valeria00007.jpg" },
          { type: "image", src: "valeria00008.jpg" },
          { type: "image", src: "valeria00009.jpg" },
          { type: "image", src: "valeria00010.jpg" },
          { type: "video", src: "valeria00024.mp4" },
          { type: "image", src: "valeria00011.jpg" },
          { type: "image", src: "valeria00012.jpg" },
          { type: "image", src: "valeria00013.jpg" },
          { type: "image", src: "valeria00014.jpg" },
          { type: "image", src: "valeria00015.jpg" },
          { type: "image", src: "valeria00016.jpg" },
          { type: "image", src: "valeria00017.jpg" },
          { type: "image", src: "valeria00018.jpg" },
          { type: "image", src: "valeria00019.jpg" },
          { type: "image", src: "valeria00020.jpg" },
          { type: "image", src: "valeria00021.jpg" }
        ]
      },
      {
        id: 2,
        name: "La Bochita",
        username: "lagochitahot1",
        image: "photo_2026-08-01 18.53.24.jpeg",
        description: "Conoce su perfil y escríbele directamente.",
        bio: "Aquí puedes escribir la descripción completa de La Bochita.",
        posts: []
      },
      ...Array.from({ length: 13 }, (_, i) => ({
        id: i + 3,
        name: `Chica ${i + 3}`,
        username: `usuario${i + 3}`,
        image: "",
        description: "Perfil disponible próximamente.",
        bio: "Añade aquí la descripción completa.",
        posts: []
      }))
    ];

    const grid = document.getElementById("profilesGrid");
    const search = document.getElementById("search");
    const profileView = document.getElementById("profileView");
    const homeView = document.getElementById("homeView");
    const heroImage = document.getElementById("heroImage");
    const profileName = document.getElementById("profileName");
    const profileBio = document.getElementById("profileBio");
    const topName = document.getElementById("topName");
    const gallery = document.getElementById("gallery");
    const buyBtn = document.getElementById("buyBtn");
    const chatBtn = document.getElementById("chatBtn");
    const viewer = document.getElementById("viewer");
    const slides = document.getElementById("slides");
    const viewerTitle = document.getElementById("viewerTitle");

    let currentCreator = null;

    function safeTelegramUsername(username) {
      return String(username || "").replace("@", "").trim();
    }

    function openTelegram(username) {
      const clean = safeTelegramUsername(username);
      if (!clean) return;
      const link = `https://t.me/${clean}`;
      if (telegram?.openTelegramLink) {
        telegram.openTelegramLink(link);
      } else {
        window.location.href = link;
      }
    }

    function imageOrPlaceholder(creator, className = "") {
      if (creator.image) {
        const img = document.createElement("img");
        img.src = creator.image;
        img.alt = `Foto de ${creator.name}`;
        img.className = className;
        img.loading = "lazy";
        return img;
      }
      const placeholder = document.createElement("div");
      placeholder.className = `placeholder ${className}`;
      placeholder.textContent = "💋";
      return placeholder;
    }

    function showCreators(list) {
      grid.innerHTML = "";
      list.forEach((creator) => {
        const card = document.createElement("article");
        card.className = "card";

        const profileButton = document.createElement("button");
        profileButton.className = "profile-link";
        profileButton.type = "button";
        profileButton.setAttribute("aria-label", `Abrir perfil de ${creator.name}`);
        profileButton.appendChild(imageOrPlaceholder(creator, "cover"));

        const body = document.createElement("div");
        body.className = "card-body";
        body.innerHTML = `
          <h2 class="name">${creator.name}</h2>
          <p class="short">${creator.description}</p>
        `;
        profileButton.appendChild(body);
        profileButton.addEventListener("click", () => openProfile(creator));

        const actions = document.createElement("div");
        actions.className = "card-actions";
        const chat = document.createElement("button");
        chat.className = "btn";
        chat.type = "button";
        chat.textContent = "Escribir por Telegram";
        chat.addEventListener("click", () => openTelegram(creator.username));
        actions.appendChild(chat);

        card.appendChild(profileButton);
        card.appendChild(actions);
        grid.appendChild(card);
      });
    }

    function likeKey(creatorId, postIndex) {
      return `lmdt-like-${creatorId}-${postIndex}`;
    }

    function isLiked(creatorId, postIndex) {
      return localStorage.getItem(likeKey(creatorId, postIndex)) === "1";
    }

    function toggleLike(button, creatorId, postIndex) {
      const key = likeKey(creatorId, postIndex);
      const liked = localStorage.getItem(key) === "1";
      if (liked) {
        localStorage.removeItem(key);
        button.classList.remove("liked");
        button.textContent = "♡";
      } else {
        localStorage.setItem(key, "1");
        button.classList.add("liked");
        button.textContent = "♥";
      }
    }

    function renderGallery(posts) {
      gallery.innerHTML = "";
      if (!posts.length) {
        const item = document.createElement("div");
        item.className = "media";
        item.innerHTML = `<div class="empty-media">＋</div>`;
        gallery.appendChild(item);
        return;
      }
      posts.forEach((post, index) => {
        const item = document.createElement("button");
        item.className = "media";
        item.type = "button";
        if (post.type === "video") {
          const video = document.createElement("video");
          video.src = post.src;
          video.muted = true;
          video.playsInline = true;
          video.preload = "metadata";
          item.appendChild(video);
        } else {
          const img = document.createElement("img");
          img.src = post.src;
          img.alt = `Publicación ${index + 1}`;
          img.loading = "lazy";
          item.appendChild(img);
        }
        item.addEventListener("click", () => openViewer(index));
        gallery.appendChild(item);
      });
    }

    function openViewer(startIndex) {
      if (!currentCreator) return;
      viewerTitle.textContent = currentCreator.name;
      slides.innerHTML = "";
      currentCreator.posts.forEach((post, index) => {
        const slide = document.createElement("article");
        slide.className = "slide";
        if (post.type === "video") {
          const video = document.createElement("video");
          video.src = post.src;
          video.controls = true;
          video.playsInline = true;
          video.preload = "metadata";
          slide.appendChild(video);
        } else {
          const img = document.createElement("img");
          img.src = post.src;
          img.alt = `Publicación ${index + 1}`;
          slide.appendChild(img);
        }
        const overlay = document.createElement("div");
        overlay.className = "slide-overlay";
        const name = document.createElement("div");
        name.className = "slide-name";
        name.textContent = currentCreator.name;
        const likeWrap = document.createElement("div");
        likeWrap.className = "like-wrap";
        const like = document.createElement("button");
        like.className = "like-btn";
        like.type = "button";
        const liked = isLiked(currentCreator.id, index);
        like.textContent = liked ? "♥" : "♡";
        if (liked) like.classList.add("liked");
        like.addEventListener("click", () => toggleLike(like, currentCreator.id, index));
        const label = document.createElement("span");
        label.className = "like-label";
        label.textContent = "Me gusta";
        likeWrap.appendChild(like);
        likeWrap.appendChild(label);
        overlay.appendChild(name);
        overlay.appendChild(likeWrap);
        slide.appendChild(overlay);
        slides.appendChild(slide);
      });
      profileView.classList.add("hidden");
      viewer.classList.remove("hidden");
      requestAnimationFrame(() => {
        const target = slides.children[startIndex];
        if (target) target.scrollIntoView({ block: "start" });
      });
    }

    function closeViewer() {
      viewer.classList.add("hidden");
      profileView.classList.remove("hidden");
      slides.querySelectorAll("video").forEach(v => v.pause());
    }

    function openProfile(creator) {
      currentCreator = creator;
      topName.textContent = creator.name;
      profileName.textContent = creator.name;
      profileBio.textContent = creator.bio || creator.description;
      heroImage.innerHTML = "";
      heroImage.appendChild(imageOrPlaceholder(creator));
      renderGallery(creator.posts || []);
      homeView.classList.add("hidden");
      profileView.classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    function closeProfile() {
      profileView.classList.add("hidden");
      homeView.classList.remove("hidden");
      currentCreator = null;
      window.scrollTo(0, 0);
    }

    document.getElementById("backBtn").addEventListener("click", closeProfile);
    document.getElementById("viewerClose").addEventListener("click", closeViewer);
    buyBtn.addEventListener("click", () => currentCreator && openTelegram(currentCreator.username));
    chatBtn.addEventListener("click", () => {
  if (!currentCreator || !currentCreator.channel) return;

  const enlaceCanal = currentCreator.channel.startsWith("http")
    ? currentCreator.channel
: "https://t.me/" + currentCreator.channel;

  openTelegram(enlaceCanal);
});
    search.addEventListener("input", () => {
      const text = search.value.toLowerCase().trim();
      const results = creators.filter((creator) =>
        creator.name.toLowerCase().includes(text)
      );
      showCreators(results);
    });

    document.getElementById("enterBtn").addEventListener("click", () => {
      document.getElementById("ageGate").classList.add("hidden");
    });

    document.getElementById("leaveBtn").addEventListener("click", () => {
      window.location.href = "https://telegram.org/";
    });

    showCreators(creators);
  </script>
</body>
</html>
