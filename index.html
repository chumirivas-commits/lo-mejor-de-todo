<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>Lo Mejor de Todo</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #5b123f 0%, #170713 45%, #080408 100%);
      color: white;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 28px 18px 20px;
    }

    .logo {
      width: 110px;
      height: 110px;
      margin: auto;
      border-radius: 50%;
      border: 3px solid #ff3ca6;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #120811;
      box-shadow: 0 0 28px rgba(255, 60, 166, 0.6);
      font-size: 42px;
    }

    h1 {
      margin: 16px 0 6px;
      font-size: 28px;
    }

    .subtitle {
      margin: 0;
      color: #f3bfdc;
      font-size: 15px;
    }

    .search-box {
      margin: 8px 16px 22px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #7b315e;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 16px;
      outline: none;
    }

    .search-box input::placeholder {
      color: #c998b5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 0 16px 30px;
    }

    .card {
      overflow: hidden;
      border-radius: 20px;
      background: #21101d;
      border: 1px solid #63304f;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
    }

    .photo {
      width: 100%;
      aspect-ratio: 4 / 5;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(145deg, #81205e, #321029);
      font-size: 54px;
    }

    .info {
      padding: 13px;
    }

    .name {
      margin: 0 0 5px;
      font-size: 18px;
    }

    .description {
      min-height: 36px;
      margin: 0 0 12px;
      color: #d6aec6;
      font-size: 13px;
      line-height: 1.35;
    }

    .button {
      display: block;
      width: 100%;
      padding: 11px 8px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(90deg, #ff278e, #d718e7);
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    footer {
      padding: 5px 20px 30px;
      text-align: center;
      color: #ba8aa9;
      font-size: 12px;
    }

    @media (min-width: 700px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
        max-width: 900px;
        margin: auto;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">💋</div>

    <h1>Lo Mejor de Todo</h1>

    <p class="subtitle">
      Descubre creadoras y comunícate directamente por Telegram
    </p>
  </header>

  <div class="search-box">
    <input
      id="search"
      type="search"
      placeholder="Buscar una creadora..."
      autocomplete="off"
    >
  </div>

  <main class="grid" id="profiles"></main>

  <footer>
    Solo perfiles de personas adultas que hayan autorizado su publicación.
  </footer>

  <script>
    const telegram = window.Telegram?.WebApp;

    if (telegram) {
      telegram.ready();
      telegram.expand();
    }

    const creators = [
      {
        name: "Chica 1",
        username: "usuario1",
        emoji: "💎",
        description: "Perfil exclusivo y atención directa por Telegram."
      },
      {
        name: "Chica 2",
        username: "usuario2",
        emoji: "💋",
        description: "Conoce su perfil y escríbele directamente."
      },
      {
        name: "Chica 3",
        username: "usuario3",
        emoji: "🌹",
        description: "Contenido personal y contacto por Telegram."
      },
      {
        name: "Chica 4",
        username: "usuario4",
        emoji: "🔥",
        description: "Descubre sus publicaciones y novedades."
      },
      {
        name: "Chica 5",
        username: "usuario5",
        emoji: "✨",
        description: "Perfil destacado de Lo Mejor de Todo."
      },
      {
        name: "Chica 6",
        username: "usuario6",
        emoji: "💖",
        description: "Comunícate con ella de manera directa."
      },
      {
        name: "Chica 7",
        username: "usuario7",
        emoji: "👑",
        description: "Una de nuestras creadoras destacadas."
      },
      {
        name: "Chica 8",
        username: "usuario8",
        emoji: "💫",
        description: "Visita su Telegram para conocerla mejor."
      },
      {
        name: "Chica 9",
        username: "usuario9",
        emoji: "🦋",
        description: "Perfil nuevo dentro de nuestra plataforma."
      },
      {
        name: "Chica 10",
        username: "usuario10",
        emoji: "💜",
        description: "Escríbele directamente desde Telegram."
      }
    ];

    const profiles = document.getElementById("profiles");
    const search = document.getElementById("search");

    function openTelegram(username) {
      const cleanUsername = username.replace("@", "");
      const link = `https://t.me/${cleanUsername}`;

      if (telegram?.openTelegramLink) {
        telegram.openTelegramLink(link);
      } else {
        window.location.href = link;
      }
    }

    function showCreators(list) {
      profiles.innerHTML = "";

      list.forEach((creator) => {
        const card = document.createElement("article");
        card.className = "card";

        card.innerHTML = `
          <div class="photo">${creator.emoji}</div>

          <div class="info">
            <h2 class="name">${creator.name}</h2>

            <p class="description">
              ${creator.description}
            </p>

            <button class="button" type="button">
              💬 Escribir por Telegram
            </button>
          </div>
        `;

        card
          .querySelector(".button")
          .addEventListener("click", () => {
            openTelegram(creator.username);
          });

        profiles.appendChild(card);
      });
    }

    search.addEventListener("input", () => {
      const text = search.value.toLowerCase().trim();

      const results = creators.filter((creator) =>
        creator.name.toLowerCase().includes(text)
      );

      showCreators(results);
    });

    showCreators(creators);
  </script>
</body>
</html>
